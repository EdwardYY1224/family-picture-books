<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244f49">
  <meta name="description" content="適合 4 歲孩子的 Pony 英文課聽說觸控遊戲。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f5c94f'/%3E%3Cpath d='M18 35c7 10 21 10 28 0' fill='none' stroke='%23244f49' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='25' r='3' fill='%23244f49'/%3E%3Ccircle cx='41' cy='25' r='3' fill='%23244f49'/%3E%3C/svg%3E">
  <title>Pony 英文課遊戲</title>
  <link rel="stylesheet" href="school.css?v=20260726-scene3">
</head>
<body class="school-play">
  <header class="play-bar">
    <a class="circle-link" href="index.html" aria-label="回到英文課遊戲屋">←</a>
    <div class="play-bar__title"><b id="gameTitle">英文課遊戲</b><small id="gameSkill">先聽，再用手指選</small></div>
    <button class="circle-link sound-button" id="soundButton" type="button" aria-pressed="true" aria-label="開關英文朗讀">🔊</button>
  </header>

  <main class="play-main">
    <section class="prompt-card" aria-labelledby="promptEn">
      <div class="progress-row"><b id="roundLabel">1 / 6</b><div id="progressDots" aria-label="遊戲進度"></div></div>
      <p class="listen-label"><span aria-hidden="true">♪</span> 聽一聽，再點一點</p>
      <h1 id="promptEn">Ready?</h1>
      <p id="promptZh">準備好了嗎？</p>
      <img class="prompt-scene" id="promptScene" src="" alt="" draggable="false" hidden>
      <button class="listen-button" id="listenButton" type="button">🔊 再聽一次</button>
    </section>

    <section class="answer-stage" aria-label="答案選擇區">
      <div class="paper-grain" aria-hidden="true"></div>
      <div class="answer-grid" id="answerGrid"></div>
      <p class="gentle-tip" id="gentleTip">慢慢來，先聽聲音就好。</p>
    </section>
  </main>

  <div class="feedback" id="feedback" role="status" aria-live="polite" hidden>
    <span aria-hidden="true">★</span>
    <div><b id="feedbackTitle">你找到了！</b><p id="feedbackText"></p></div>
    <button id="nextButton" type="button">下一題 →</button>
  </div>

  <div class="game-overlay" id="startOverlay" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="overlay-card">
      <span class="overlay-card__icon" id="startIcon"></span>
      <p class="kicker">4–7 MINUTES · AGE 4</p>
      <h2 id="startTitle">英文課遊戲</h2>
      <p id="startBlurb"></p>
      <ul><li>英文會慢慢念</li><li>答錯只會再聽一次</li><li>孩子不想玩時就停</li></ul>
      <button class="primary-button" id="startButton" type="button">開始聽 →</button>
    </div>
  </div>

  <div class="game-overlay" id="finishOverlay" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden>
    <div class="overlay-card">
      <span class="overlay-card__icon finish-star" aria-hidden="true">★</span>
      <p class="kicker">YOU DID IT!</p>
      <h2 id="finishTitle">今天聽得真仔細！</h2>
      <p id="finishMessage"></p>
      <div class="finish-actions"><button class="primary-button" id="againButton" type="button">再玩一次</button><a href="index.html">選別的遊戲</a></div>
    </div>
  </div>

  <script src="../games/js/icons.js?v=20260726-scene3"></script>
  <script src="school-data.js?v=20260726-scene3"></script>
  <script src="school-game.js?v=20260726-scene3"></script>
</body>
</html>
