<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244f49">
  <meta name="description" content="適合 4 歲孩子使用手機或平板操作的十款城市學習遊戲。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f5c94f'/%3E%3Cpath d='M18 35c7 10 21 10 28 0' fill='none' stroke='%23244f49' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='25' r='3' fill='%23244f49'/%3E%3Ccircle cx='41' cy='25' r='3' fill='%23244f49'/%3E%3C/svg%3E">
  <title>城市學習遊戲館｜小小探索家</title>
  <link rel="stylesheet" href="city-games.css">
</head>
<body class="hub-page">
  <header class="hub-hero">
    <a class="round-link" id="homeLink" href="../index.html" aria-label="回到家庭學習地圖">←</a>
    <div>
      <p class="kicker" id="hubKicker">TEN TOUCH ADVENTURES</p>
      <h1 id="hubTitle">城市學習遊戲館</h1>
      <p id="hubSubtitle">用手指點一點、拖一拖。每款三個關卡，越玩越有趣。</p>
    </div>
    <button class="round-link lang-toggle" id="hubLangToggle" type="button" aria-label="Switch language">EN</button>
  </header>

  <main class="hub-main">
    <section class="game-grid" id="gameGrid" aria-label="選擇遊戲"></section>
    <p class="care-note" id="hubCareNote">♥ 大人陪在身邊即可；孩子疲累或不想玩時就停下來。</p>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
