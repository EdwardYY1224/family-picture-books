<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244f49">
  <meta name="description" content="適合 4 歲孩子的手機與平板觸控學習遊戲。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f5c94f'/%3E%3Cpath d='M18 35c7 10 21 10 28 0' fill='none' stroke='%23244f49' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='25' r='3' fill='%23244f49'/%3E%3Ccircle cx='41' cy='25' r='3' fill='%23244f49'/%3E%3C/svg%3E">
  <title>城市學習遊戲｜小小探索家</title>
  <link rel="stylesheet" href="city-games.css">
</head>
<body class="play-page">
  <header class="play-header">
    <a class="round-link" id="backLink" href="index.html" aria-label="回到遊戲館">←</a>
    <div class="play-brand"><span id="brandIcon"></span><div><b id="brandTitle">城市遊戲</b><small id="brandTag">每題只看一個重點</small></div></div>
    <div class="header-buttons">
      <button class="round-link lang-toggle" id="langToggle" type="button" aria-label="Switch language">EN</button>
      <button class="round-link sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="切換語音">🔊</button>
    </div>
  </header>

  <main class="play-main">
    <section class="task-card" aria-labelledby="taskPrompt">
      <div class="task-progress"><b id="roundText">準備出發</b><div id="progressDots" aria-label="遊戲進度"></div></div>
      <div class="task-copy"><span id="taskIcon"></span><div><small id="taskLabel">聽一聽，玩一玩</small><h1 id="taskPrompt">準備好了嗎？</h1></div></div>
      <div class="task-actions">
        <button id="replayTask" type="button" disabled>↻ 再聽一次</button>
        <button id="showHint" type="button" disabled>☀ 給我提示</button>
      </div>
    </section>

    <section class="game-stage" id="gameStage" aria-label="遊戲操作區">
      <div class="paper-dots" aria-hidden="true"></div>
      <span class="stage-doodle stage-doodle--one" aria-hidden="true">★</span>
      <span class="stage-doodle stage-doodle--two" aria-hidden="true">⌁</span>
      <p class="stage-guide" id="stageGuide">用手指操作吧！</p>
      <div class="round-content" id="roundContent"></div>
      <div class="feedback-panel" id="feedbackPanel" role="status" aria-live="polite" hidden>
        <span>✦</span><div><b id="feedbackTitle"></b><p id="feedbackText"></p></div><button id="nextRound" type="button">下一題 →</button>
      </div>
    </section>
    <p class="care-note" id="careNote">♥ 不用急著答對；先讓孩子自己試，再使用提示。</p>
  </main>

  <div class="overlay" id="startOverlay" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="overlay-card">
      <span class="overlay-icon" id="startIcon"></span>
      <p class="kicker" id="startKicker">9 MINUTE GAME</p>
      <h2 id="startTitle">城市遊戲</h2>
      <p id="startDescription"></p>
      <ul id="startBullets"></ul>
      <button class="primary-action" id="resumeGame" type="button" hidden></button>
      <button class="primary-action" id="startGame" type="button">開始遊戲 →</button>
    </div>
  </div>

  <div class="overlay" id="stageOverlay" role="dialog" aria-modal="true" aria-labelledby="stageTitle" hidden>
    <div class="overlay-card overlay-card--stage">
      <span class="overlay-icon" id="stageIcon"></span>
      <p class="kicker" id="stageKicker">1 / 3</p>
      <h2 id="stageTitle">暖身出發</h2>
      <p id="stageText"></p>
      <button class="primary-action" id="stageGo" type="button">出發 →</button>
    </div>
  </div>

  <div class="overlay" id="finishOverlay" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden>
    <div class="overlay-card">
      <span class="overlay-icon celebrate-icon">★</span>
      <p class="kicker" id="finishKicker">GAME COMPLETE</p>
      <h2 id="finishTitle">完成了！</h2>
      <p id="finishMessage">今天的任務都完成了。</p>
      <div class="finish-stats">
        <div><b id="correctTotal">9</b><small id="correctLabel">完成題數</small></div>
        <div><b id="hintTotal">0</b><small id="hintLabel">使用提示</small></div>
      </div>
      <div class="finish-actions">
        <button class="primary-action" id="playAgain" type="button">再玩一次</button>
        <a id="backHub" href="index.html">回遊戲館</a>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data/shapes.js"></script>
  <script src="js/data/counting.js"></script>
  <script src="js/data/traffic.js"></script>
  <script src="js/data/sounds.js"></script>
  <script src="js/data/compare.js"></script>
  <script src="js/data/sequence.js"></script>
  <script src="js/data/recycle.js"></script>
  <script src="js/data/emotions.js"></script>
  <script src="js/data/market.js"></script>
  <script src="js/engine.js?v=20260726-real-city-sounds"></script>
</body>
</html>
