<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244f49">
  <meta name="description" content="5 歲小朋友的語音引導觸控探索遊戲。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f5c94f'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23244f49'/%3E%3C/svg%3E">
  <title>5 歲小小探索家</title>
  <link rel="stylesheet" href="../shared/city-games.css?v=20260812-order-picture-fix">
</head>
<body class="play-page">
  <header class="play-header">
    <a class="round-link" id="backLink" href="index.html" aria-label="回到 5 歲課程">←</a>
    <div class="play-brand"><span id="brandIcon"></span><div><b id="brandTitle">小小探索家</b><small id="brandTag">聽一聽，動手玩</small></div></div>
    <div class="header-buttons">
      <button class="round-link lang-toggle" id="langToggle" type="button" aria-label="Switch language">EN</button>
      <button class="round-link sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="切換聲音">♪</button>
    </div>
  </header>

  <main class="play-main">
    <section class="task-card" aria-labelledby="taskPrompt">
      <div class="task-progress"><b id="roundText">準備好了</b><div id="progressDots" aria-label="遊戲進度"></div></div>
      <div class="task-copy"><span id="taskIcon"></span><div><small id="taskLabel">先聽，再動手</small><h1 id="taskPrompt">準備開始</h1></div></div>
      <div class="task-actions">
        <button id="replayTask" type="button" disabled>再聽一次</button>
        <button id="showHint" type="button" disabled>幫幫我</button>
      </div>
    </section>

    <section class="game-stage" id="gameStage" aria-label="遊戲操作區">
      <div class="paper-dots" aria-hidden="true"></div>
      <span class="stage-doodle stage-doodle--one" aria-hidden="true">✦</span>
      <span class="stage-doodle stage-doodle--two" aria-hidden="true">⌁</span>
      <p class="stage-guide" id="stageGuide">聽完題目後，點一下大圖卡。</p>
      <div class="round-content" id="roundContent"></div>
      <div class="feedback-panel" id="feedbackPanel" role="status" aria-live="polite" hidden>
        <span>✓</span><div><b id="feedbackTitle"></b><p id="feedbackText"></p></div><button id="nextRound" type="button">下一題</button>
      </div>
    </section>
    <p class="care-note" id="careNote">讓孩子先聽、先試；需要時再使用提示。</p>
  </main>

  <div class="overlay" id="startOverlay" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="overlay-card">
      <span class="overlay-icon" id="startIcon"></span>
      <p class="kicker" id="startKicker">8 MINUTE GAME</p>
      <h2 id="startTitle">小小探索家</h2>
      <p id="startDescription"></p>
      <ul id="startBullets"></ul>
      <button class="primary-action" id="resumeGame" type="button" hidden></button>
      <button class="primary-action" id="startGame" type="button">開始遊戲</button>
    </div>
  </div>

  <div class="overlay" id="stageOverlay" role="dialog" aria-modal="true" aria-labelledby="stageTitle" hidden>
    <div class="overlay-card overlay-card--stage">
      <span class="overlay-icon" id="stageIcon"></span>
      <p class="kicker" id="stageKicker">1 / 3</p>
      <h2 id="stageTitle">暖身</h2>
      <p id="stageText"></p>
      <button class="primary-action" id="stageGo" type="button">開始</button>
    </div>
  </div>

  <div class="overlay" id="finishOverlay" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden>
    <div class="overlay-card">
      <span class="overlay-icon celebrate-icon">★</span>
      <p class="kicker" id="finishKicker">GAME COMPLETE</p>
      <h2 id="finishTitle">完成了！</h2>
      <p id="finishMessage">今天的探索任務完成了。</p>
      <div class="finish-stats">
        <div><b id="correctTotal">6</b><small id="correctLabel">完成題數</small></div>
        <div><b id="hintTotal">0</b><small id="hintLabel">提示次數</small></div>
      </div>
      <div class="finish-actions">
        <button class="primary-action" id="playAgain" type="button">再玩一次</button>
        <a id="backHub" href="index.html">全部課程</a>
      </div>
    </div>
  </div>

  <script src="../shared/js/icons.js?v=20260812-published"></script>
  <script src="../shared/js/i18n.js?v=20260812-published"></script>
  <script src="audio/natural/audio-map.js?v=20260812-pronunciation-fix"></script>
  <script src="age-5-games.js?v=20260811-age5-painted-choices"></script>
  <script src="age-5-expanded-games.js?v=20260811-all-40"></script>
  <script src="age-5-memory-games.js?v=20260812-missing-logic-fix"></script>
  <script src="../shared/js/engine.js?v=20260812-order-picture-fix"></script>
</body>
</html>
